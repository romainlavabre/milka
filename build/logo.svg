<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Milka, the brindle dog, resting her chin on an HTTP request. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262a34"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fc870"/>
      <stop offset="0.45" stop-color="#60e496"/>
      <stop offset="1" stop-color="#4dd27f"/>
    </linearGradient>
    <linearGradient id="barTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#96f3bd"/>
      <stop offset="1" stop-color="#59e18d"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6440"/>
      <stop offset="1" stop-color="#644429"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#644429" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#4a3322"/>
      <stop offset="1" stop-color="#241913"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f6842"/>
      <stop offset="1" stop-color="#6c4a2c"/>
    </linearGradient>
    <clipPath id="head">
      <path d="M256 102 C318 102 356 144 358 198 C360 238 344 264 330 284 C314 306 290 324 256 326 C222 324 198 306 182 284 C168 264 152 238 154 198 C156 144 194 102 256 102 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <g transform="translate(0 -4)">
    <!-- The request: method and URL on a golden bar. -->
    <rect x="96" y="318" width="320" height="112" rx="30" fill="url(#bar)"/>
    <rect x="96" y="318" width="320" height="34" rx="17" fill="url(#barTop)"/>
    <rect x="126" y="366" width="96" height="40" rx="12" fill="#1c1c1f"/>
    <text x="174" y="395" text-anchor="middle" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="1" fill="#60e496">GET</text>
    <rect x="236" y="380" width="92" height="12" rx="6" fill="#1c1c1f" fill-opacity="0.55"/>

    <!-- Ears: large semi-drop ears, dark brindle; they rise, crease, and the tip flops outward. -->
    <!-- Written out rather than mirrored with <use>, which some SVG viewers do not render. -->
    <path d="M238 126 C226 84 196 48 158 40 C144 64 140 100 146 132 C160 148 180 154 194 152 C212 142 228 134 238 126 Z" fill="url(#ear)"/>
    <path d="M158 40 C126 36 98 56 86 88 C78 112 82 134 96 142 C110 150 128 138 140 120 C152 100 158 72 158 40 Z" fill="#654529"/>
    <path d="M158 40 C152 74 144 102 132 124" fill="none" stroke="#2e1f13" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M274 126 C286 84 316 48 354 40 C368 64 372 100 366 132 C352 148 332 154 318 152 C300 142 284 134 274 126 Z" fill="url(#ear)"/>
    <path d="M354 40 C386 36 414 56 426 88 C434 112 430 134 416 142 C402 150 384 138 372 120 C360 100 354 72 354 40 Z" fill="#654529"/>
    <path d="M354 40 C360 74 368 102 380 124" fill="none" stroke="#2e1f13" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Head: brindle coat, lighter brows, dark muzzle. -->
    <path d="M256 102 C318 102 356 144 358 198 C360 238 344 264 330 284 C314 306 290 324 256 326 C222 324 198 306 182 284 C168 264 152 238 154 198 C156 144 194 102 256 102 Z" fill="url(#coat)"/>
    <g clip-path="url(#head)">
      <!-- Brindle: thin, broken dark streaks. -->
      <g fill="none" stroke="#3b2717" stroke-width="3.5" stroke-linecap="round" opacity="0.38">
        <path d="M164 160 C170 176 170 192 166 206"/>
        <path d="M172 214 C178 230 178 246 172 258"/>
        <path d="M180 140 C188 158 190 178 186 194"/>
        <path d="M190 206 C196 222 196 240 192 252"/>
        <path d="M198 122 C204 136 206 150 204 162"/>
        <path d="M218 112 C222 124 224 134 222 144"/>
        <path d="M348 160 C342 176 342 192 346 206"/>
        <path d="M340 214 C334 230 334 246 340 258"/>
        <path d="M332 140 C324 158 322 178 326 194"/>
        <path d="M322 206 C316 222 316 240 320 252"/>
        <path d="M314 122 C308 136 306 150 308 162"/>
        <path d="M294 112 C290 124 288 134 290 144"/>
        <path d="M240 118 C243 128 243 138 241 146"/>
        <path d="M272 118 C269 128 269 138 271 146"/>
      </g>
      <path d="M256 112 L256 168" stroke="#3b2717" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
      <ellipse cx="222" cy="176" rx="20" ry="9" fill="#b88a58" opacity="0.6" transform="rotate(-12 222 176)"/>
      <ellipse cx="290" cy="176" rx="20" ry="9" fill="#b88a58" opacity="0.6" transform="rotate(12 290 176)"/>
      <path d="M256 196 C290 196 308 228 312 260 C316 294 292 324 256 326 C220 324 196 294 200 260 C204 228 222 196 256 196 Z" fill="url(#muzzle)"/>
    </g>

    <!-- Eyes: amber, soft. -->
    <ellipse cx="214" cy="204" rx="16" ry="14" fill="#d38f3a"/>
    <ellipse cx="298" cy="204" rx="16" ry="14" fill="#d38f3a"/>
    <circle cx="215" cy="205" r="8.5" fill="#1a100a"/>
    <circle cx="297" cy="205" r="8.5" fill="#1a100a"/>
    <circle cx="209" cy="199" r="4.5" fill="#ffffff"/>
    <circle cx="291" cy="199" r="4.5" fill="#ffffff"/>
    <path d="M197 202 C200 191 216 186 230 194" fill="none" stroke="#2a1b10" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M315 202 C312 191 296 186 282 194" fill="none" stroke="#2a1b10" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Nose and mouth. -->
    <path d="M228 274 C228 258 284 258 284 274 C284 294 270 306 256 306 C242 306 228 294 228 274 Z" fill="#121012"/>
    <ellipse cx="247" cy="267" rx="8" ry="3.5" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M256 306 v7 M256 313 c-8 5 -16 5 -22 1 M256 313 c8 5 16 5 22 1" fill="none" stroke="#120c08" stroke-width="4" stroke-linecap="round"/>

    <!-- Paws over the edge of the bar. -->
    <g fill="url(#coat)" stroke="#3b2717" stroke-width="3">
      <path d="M144 322 C144 304 190 300 198 316 C204 330 194 348 174 350 C154 352 144 338 144 322 Z"/>
      <path d="M368 322 C368 304 322 300 314 316 C308 330 318 348 338 350 C358 352 368 338 368 322 Z"/>
    </g>
    <g stroke="#3b2717" stroke-width="3" stroke-linecap="round">
      <path d="M162 334 v10 M178 336 v10"/>
      <path d="M350 334 v10 M334 336 v10"/>
    </g>
  </g>

  <!-- Request / response badge. -->
  <g transform="translate(404 404) scale(0.62) translate(-378 -378)">
    <circle cx="378" cy="378" r="98" fill="#15171c"/>
    <circle cx="378" cy="378" r="84" fill="#20232b" stroke="#60e496" stroke-width="7"/>
    <g fill="none" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M332 352 h86 M398 330 l22 22 l-22 22" stroke="#60e496"/>
      <path d="M424 404 h-86 M358 382 l-22 22 l22 22" stroke="#eef0f4"/>
    </g>
  </g>
</svg>
